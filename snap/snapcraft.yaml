name: stdlib
adopt-info: stdlib
summary: Fortran Standard Library
description: |
  The Fortran Standard, as published by the ISO (https://wg5-fortran.org/), does not have a 
  Standard Library. The goal of this project is to provide a community driven and agreed upon 
  de facto "standard" library for Fortran, called a Fortran Standard Library (stdlib). We have a   
  rigorous process how stdlib is developed as documented in our Workflow. stdlib is both a
  specification and a reference implementation. We are cooperating with the Fortran Standards 
  Committee (e.g., the effort started at the J3 committee repository) and the plan is to continue
  working with the Committee in the future (such as in the step 5. in the Workflow document), 
  so that if the Committee wants to standardize some feature already available in stdlib, 
  it would base it on stdlib's implementation.
  
license: MIT
source-code: https://github.com/fortran-lang/stdlib
issues: https://github.com/kz6fittycent/stdlib/issues
contact: https://github.com/kz6fittycent/stdlib
icon: snap/local/stdlib.png
base: core24
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  s390x: 
    build-on: [amd64]
    build-for: [s390x]
  ppc64el:
    build-on: [amd64]
    build-for: [ppc64el]

parts:
  fypp:
    source: https://github.com/aradi/fypp
    source-type: git
    plugin: python
    python-packages:
      - fypp
    # Only needed to build; not part of the library.
    prime:
      - -bin/pip*
      - -lib/python*/site-packages/pip
      - -lib/python*/site-packages/pip-*

  stdlib:
    source: https://github.com/fortran-lang/stdlib
    source-type: git
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr/local/stdlib
    build-environment:
      - CMAKE_TOOLCHAIN_FILE: $CRAFT_PART_BUILD/snap-toolchain.cmake
    after:
      - fypp

    build-packages:
      - gcc-10
      - g++-10
      - gfortran-10
      - ninja-build
      # ppc64el and s390x are cross-compiled
      - on amd64 to ppc64el:
          - gcc-10-powerpc64le-linux-gnu
          - g++-10-powerpc64le-linux-gnu
          - gfortran-10-powerpc64le-linux-gnu
      - on amd64 to s390x:
          - gcc-10-s390x-linux-gnu
          - g++-10-s390x-linux-gnu
          - gfortran-10-s390x-linux-gnu

    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags | sed 's/^v//' | cut -d "-" -f1)"

    # CMake finds out about quad precision by running test programs, which can't
    # work when cross-compiling, so the answers (from native builds) are given
    # here: ppc64el has IBM double-double (XDP, no QP), s390x has IEEE quad (QP).
    override-build: |
      T=$CRAFT_ARCH_TRIPLET_BUILD_FOR
      {
        echo "set(CMAKE_C_COMPILER /usr/bin/$T-gcc-10)"
        echo "set(CMAKE_CXX_COMPILER /usr/bin/$T-g++-10)"
        echo "set(CMAKE_Fortran_COMPILER /usr/bin/$T-gfortran-10)"
        if [ "$CRAFT_ARCH_BUILD_ON" != "$CRAFT_ARCH_BUILD_FOR" ]; then
          echo "set(CMAKE_SYSTEM_NAME Linux)"
          case "$CRAFT_ARCH_BUILD_FOR" in
            ppc64el) P=ppc64le; QP=0; XDP=1 ;;
            s390x) P=s390x; QP=1; XDP=0 ;;
            *) echo "No cross settings for $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
          esac
          echo "set(CMAKE_SYSTEM_PROCESSOR $P)"
          echo "set(WITH_CBOOL 1 CACHE STRING \"\")"
          for prefix in "" TESTDRIVE_; do
            echo "set(${prefix}WITH_QP $QP CACHE STRING \"\")"
            echo "set(${prefix}WITH_XDP $XDP CACHE STRING \"\")"
          done
          echo "set(TESTDRIVE_WITH_IEEE_IS_NAN 1 CACHE STRING \"\")"
          echo "set(f18errorstop 0 CACHE STRING \"\")"
          echo "set(f03real128 1 CACHE STRING \"\")"
        fi
      } > "$CRAFT_PART_BUILD/snap-toolchain.cmake"
      craftctl default
